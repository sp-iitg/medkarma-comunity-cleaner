name: Firebase Auto Cleaner

on:
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন রাত ১২টায় (UTC) স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch: # তুমি চাইলে গিটহাব থেকে ম্যানুয়ালি বাটনে ক্লিক করেও রান করাতে পারবে

jobs:
  clean-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Run Cleaner Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node index.js
